apiVersion: metaphor.run/v1
kind: Playbook
metadata:
  id: zendesk-negative-csat-alert
  name: Zendesk Negative CSAT Alert
  description: Detect bad Zendesk satisfaction ratings, look up HubSpot account context, generate an AI summary, and ping the account owner in Slack with deduplication.
spec:
  trigger:
    type: webhook
    webhook:
      provider: zendesk
      integrationId: zendesk
      token: ""
      responseMode: immediate
  inputSchema:
    type: object
    properties:
      slack_channel:
        type: string
        description: Slack channel ID or name for CSAT alerts (e.g. #customer-success)
  steps:
    - id: filter_rating
      type: code
      language: typescript
      codeFile: steps/filter_rating.ts
      description: Check if the rating qualifies as negative and deserves an alert.
      friendlyMessage: Filtering the rating
      input: "{{ flow.input }}"
      output:
        variable: result
        format: json
    - id: fetch_ticket
      type: code
      language: typescript
      codeFile: steps/fetch_ticket.ts
      description: Fetch full ticket details from Zendesk including subject, description, and status.
      friendlyMessage: Fetching ticket details
      input:
        ticket_id: "{{ steps.filter_rating.output.ticket_id }}"
        is_negative: "{{ steps.filter_rating.output.is_negative }}"
      output:
        variable: result
        format: json
    - id: lookup_hubspot
      type: code
      language: typescript
      codeFile: steps/lookup_hubspot.ts
      description: Find the requester in HubSpot and fetch account owner and recent notes.
      friendlyMessage: Looking up account context
      input:
        requester_email: "{{ steps.filter_rating.output.requester_email }}"
      output:
        variable: result
        format: json
    - id: summarize_ticket
      type: code
      language: typescript
      codeFile: steps/summarize_ticket.ts
      description: Use AI to summarize the ticket and the customer's frustration.
      friendlyMessage: Summarizing the feedback
      input:
        ticket: "{{ steps.fetch_ticket.output }}"
        rating_comment: "{{ steps.filter_rating.output.rating_comment }}"
        hubspot_notes: "{{ steps.lookup_hubspot.output.notes }}"
      output:
        variable: result
        format: json
    - id: alert_owner
      type: code
      language: typescript
      codeFile: steps/alert_owner.ts
      description: Post the CSAT alert to Slack, tagging the account owner or the fallback channel.
      friendlyMessage: Alerting the account owner
      input:
        slack_message: "{{ steps.summarize_ticket.output.slack_message }}"
        slack_channel: "{{ flow.input.slack_channel }}"
        owner_email: "{{ steps.lookup_hubspot.output.owner_email }}"
      output:
        variable: result
        format: json
