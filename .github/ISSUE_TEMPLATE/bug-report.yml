name: Template bug
description: A template fails to import or run
labels: [bug]
body:
  - type: input
    id: template
    attributes:
      label: Template
      description: The folder name, for example `zendesk-ticket-triage`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the failing step and the error shown in Studio. Never paste secrets.
    validations:
      required: true
